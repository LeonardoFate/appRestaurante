# --- Base de datos -----------------------------------------------------------
# La aplicacion se conecta con un rol que pertenece a app_backend (NO dueno de las
# tablas, sin BYPASSRLS). Las credenciales reales llegan por variables de entorno.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurantes}
quarkus.datasource.username=${DB_USER:api_login}
quarkus.datasource.password=${DB_PASSWORD:api}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20
# Se detectan fugas de conexiones (una conexion devuelta sin cerrar rompe el aislamiento).
quarkus.datasource.jdbc.leak-detection-interval=60S

# Segundo datasource, "scheduler": lo usan SOLO el relay del outbox y el worker de la cola de trabajos, que
# recorren varios restaurantes. Se conecta con otro login (rol app_scheduler, BYPASSRLS pero con privilegios
# minimos sobre outbox y jobs). La aplicacion normal nunca puede ver datos de otros restaurantes.
quarkus.datasource."scheduler".db-kind=postgresql
quarkus.datasource."scheduler".jdbc.url=${SCHEDULER_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/restaurantes}}
quarkus.datasource."scheduler".username=${SCHEDULER_DB_USER:sched_login}
quarkus.datasource."scheduler".password=${SCHEDULER_DB_PASSWORD:sched}
quarkus.datasource."scheduler".jdbc.min-size=1
quarkus.datasource."scheduler".jdbc.max-size=4

# --- Relay del outbox y cola de trabajos ---------------------------------------
app.relay.intervalo=1s
app.relay.lote=50
app.relay.max-intentos=10
app.jobs.intervalo=2s
app.jobs.lote=10
# Un trabajo reclamado se considera perdido (y otro worker puede tomarlo) si no termina en este tiempo.
app.jobs.lease-segundos=300

# --- HTTP / salud --------------------------------------------------------------
quarkus.http.port=8080
quarkus.smallrye-health.root-path=/health

# --- Seguridad (JWT) -----------------------------------------------------------
# El tenant, la sucursal y el usuario salen SOLO del token verificado (ADR-002, ADR-005).
# En produccion la clave publica llega por configuracion; si falta, la aplicacion no arranca
# (falla cerrado). Claims esperados: sub (usuario), tenant_id, sucursal_id, groups (roles).
mp.jwt.verify.issuer=restaurantes
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
# La clave privada firma los tokens que emite el modulo auth; vive en el gestor de secretos.
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}

# --- Autenticacion (modulo auth) -------------------------------------------------
app.auth.access-minutos=15
app.auth.refresh-dias=30
# Bloqueo por intentos fallidos de login
app.auth.max-intentos=5
app.auth.bloqueo-minutos=15
# Argon2id (valores minimos recomendados por OWASP: m=19 MiB, t=2, p=1)
app.auth.argon2.memoria-kb=19456
app.auth.argon2.iteraciones=2
app.auth.argon2.paralelismo=1
# Todo endpoint de negocio debe declarar sus roles; lo que no los declare se deniega.
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# --- Negocio -------------------------------------------------------------------
# Zona horaria para el dia operativo mientras no se lea de la sucursal.
app.zona-horaria=America/Guayaquil

# --- Pruebas -------------------------------------------------------------------
# Las pruebas usan una base ya levantada (ver appRestaurante/backend/README.md). Pool de UNA conexion
# para demostrar que el contexto de tenant no se filtra entre usos de la misma conexion.
%test.quarkus.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/restaurantes}
%test.quarkus.datasource."scheduler".jdbc.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/restaurantes}
# En las pruebas el relay y el worker NO corren solos: cada prueba los invoca a mano para que el resultado sea
# determinista (hay una prueba aparte, con el perfil SchedulerActivo, que comprueba el funcionamiento periodico).
%test.quarkus.scheduler.enabled=false
%test.quarkus.datasource.jdbc.min-size=1
%test.quarkus.datasource.jdbc.max-size=1
# Claves SOLO de prueba (src/test/resources); firman y verifican los JWT de los tests.
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem
