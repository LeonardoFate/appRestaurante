# Ninguna prueba debe tardar mas de 2 minutos (la mas lenta, la del planificador, tarda unos 5 s). Un cuelgue
# por un bloqueo o una conexion sin devolver se convierte en un fallo con traza, en lugar de minutos de espera.
junit.jupiter.execution.timeout.default = 120 s

# Obligatorio con Quarkus cuando existe este archivo: agrupa las pruebas por perfil para no reiniciar la aplicacion
# mas veces de las necesarias (ver el mensaje de error de QuarkusTestProfileAwareClassOrderer).
junit.jupiter.testclass.order.default = io.quarkus.test.junit.util.QuarkusTestProfileAwareClassOrderer
